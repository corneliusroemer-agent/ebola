# Config for the CI build, which checks the workflow runs end to end without
# depending on the ingest workflow having run first. It reuses the phylogenetic
# workflow's example data, which is a small set of open BDBV records.
inputs:
  - name: example_data
    sequences: "../phylogenetic/example_data/{species}/sequences.fasta"
    metadata: "../phylogenetic/example_data/{species}/metadata.tsv"
    id_field: id
