# This configuration file should contain all required configuration parameters
# for the Nextclade workflow to run to completion.
#
# Define optional config parameters with their default values here so that users
# do not have to dig through the workflows to figure out the default values

cores: 8

changelog_url: "https://raw.githubusercontent.com/nextstrain/nextclade_data/refs/heads/master/data/nextstrain/orthoebolavirus/{species}/CHANGELOG.md"

# Inputs to the workflow. The sequences and metadata of every listed input are
# concatenated before filtering, so a build can draw on several sources.
# `{species}` is filled in per build. Override with --configfile to build from
# something other than the ingest workflow's output, as build-configs/ci does.
inputs:
  - name: open
    sequences: "../ingest/results/{species}/sequences_open.fasta"
    metadata: "../ingest/results/{species}/metadata_open.tsv"
  - name: restricted
    sequences: "../ingest/results/{species}/sequences_restricted.fasta"
    metadata: "../ingest/results/{species}/metadata_restricted.tsv"
